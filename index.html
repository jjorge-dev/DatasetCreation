<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller ML - Recolector S/N</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }

    input {
      display: block;
      margin: 12px auto;
      padding: 12px;
      font-size: 18px;
      width: 80%;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    canvas {
      background: white;
      border: 3px solid #222;
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
      margin: 16px auto;
      display: block;
      width: 280px;
      height: 280px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px;
      cursor: pointer;
    }

    button.secondary {
      background: #777;
    }

    button:hover {
      opacity: .85;
    }

    .hint {
      color: #666;
      font-size: 14px;
    }

    #counter {
      font-size: 24px;
      font-weight: bold;
    }

    #status {
      min-height: 28px;
      font-weight: bold;
    }

    .ok {
      color: #078a4b;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main>
    <h1>Recolector S / N</h1>
    <p>Dibuja letras para crear un pequeño dataset de aprendizaje automático.</p>

    <section id="setup" class="card">
      <h2>Datos iniciales</h2>

      <label>Alias del participante</label>
      <input id="alias" placeholder="ej. alumno07" autocomplete="off">

      <label>URL de Google Apps Script</label>
      <input id="endpoint" placeholder="Pega aquí la URL /exec">

      <button id="startBtn">Empezar</button>

      <p class="hint">No uses nombres reales. Usa un alias. La URL de Apps Script la dará el profesor.</p>
    </section>

    <section id="collector" class="card hidden">
      <h2 id="taskTitle">Dibuja una S</h2>
      <p id="counter">S 1/20</p>

      <canvas id="canvas" width="280" height="280"></canvas>

      <div>
        <button class="secondary" id="clearBtn">Borrar</button>
        <button id="saveBtn">Guardar dibujo</button>
      </div>

      <p id="status"></p>
    </section>

    <section id="done" class="card hidden">
      <h2>¡Dataset completado!</h2>
      <p>Has enviado todas tus muestras.</p>
    </section>
  </main>

  <script>
    const TOTAL_PER_CLASS = 20;
    const labels = ["S", "N"];

    let alias = "";
    let endpoint = "";
    let currentLabelIndex = 0;
    let currentSample = 1;
    let drawing = false;

    const setup = document.getElementById("setup");
    const collector = document.getElementById("collector");
    const done = document.getElementById("done");

    const aliasInput = document.getElementById("alias");
    const endpointInput = document.getElementById("endpoint");
    const startBtn = document.getElementById("startBtn");

    const taskTitle = document.getElementById("taskTitle");
    const counter = document.getElementById("counter");
    const statusText = document.getElementById("status");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resetCanvas() {
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "black";
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    function updateUI() {
      const label = labels[currentLabelIndex];
      taskTitle.textContent = `Dibuja una ${label}`;
      counter.textContent = `${label} ${currentSample}/${TOTAL_PER_CLASS}`;
      statusText.textContent = "";
      statusText.className = "";
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const touch = event.touches ? event.touches[0] : event;
      return {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(event) {
      event.preventDefault();
      drawing = true;
      const pos = getPointerPosition(event);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(event) {
      if (!drawing) return;
      event.preventDefault();
      const pos = getPointerPosition(event);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing(event) {
      event.preventDefault();
      drawing = false;
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing);
    canvas.addEventListener("touchmove", draw);
    canvas.addEventListener("touchend", stopDrawing);

    startBtn.addEventListener("click", () => {
      alias = aliasInput.value.trim();
      endpoint = endpointInput.value.trim();

      if (!alias) {
        alert("Introduce un alias.");
        return;
      }

      if (!endpoint || !endpoint.startsWith("https://")) {
        alert("Introduce la URL pública de Apps Script terminada en /exec.");
        return;
      }

      localStorage.setItem("sn_endpoint", endpoint);
      localStorage.setItem("sn_alias", alias);

      setup.classList.add("hidden");
      collector.classList.remove("hidden");
      resetCanvas();
      updateUI();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      resetCanvas();
      statusText.textContent = "";
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const label = labels[currentLabelIndex];
      const image = canvas.toDataURL("image/png");

      statusText.textContent = "Enviando...";
      statusText.className = "";

      try {
        const payload = {
          alias: alias,
          label: label,
          sample_index: currentSample,
          image: image,
          user_agent: navigator.userAgent
        };

        /*
          Apps Script a veces da problemas con CORS si se usa application/json.
          Por eso se envía como text/plain y se parsea manualmente en Apps Script.
        */
        await fetch(endpoint, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        statusText.textContent = "Guardado";
        statusText.className = "ok";

        currentSample += 1;

        if (currentSample > TOTAL_PER_CLASS) {
          currentLabelIndex += 1;
          currentSample = 1;
        }

        if (currentLabelIndex >= labels.length) {
          collector.classList.add("hidden");
          done.classList.remove("hidden");
        } else {
          resetCanvas();
          updateUI();
        }
      } catch (err) {
        statusText.textContent = "Error al enviar. Revisa la conexión.";
        statusText.className = "error";
      }
    });

    endpointInput.value = localStorage.getItem("sn_endpoint") || "";
    aliasInput.value = localStorage.getItem("sn_alias") || "";

    resetCanvas();
  </script>
</body>
</html>
